# Default values for level config
schemes:
  - elgamal          

levels: # Electoral size/voter count
  - 10

repetitions: 1

# For reproducibility, seed per config election run
seed: 424242

ballot_face: nle2025 # key into config/ballot_face.yaml

# Stage 3 aggregates with verify_p=False, matching Election.compute_tally
# (helios/models.py:491, "assuming votes already verified"). Verification is real
# production cost but it is paid at CAST time in Celery, per ballot, not at tally.
# There is no tally-time verification metric and no max-N gate for one.

# Stage 2a sampled encryption. Pilot at n0, then derive n
pilot:
  n0: 1000
  target_ci_fraction: 0.05   # 95% CI within ±5% of the mean
  z: 1.96

# Stage 2b bulk generation
#   pool_size: null      -> every ballot distinct 
#   pool_size: <int>     -> ballot-pool reuse
#   stream: true         -> never persist the board 
bulk:
  pool_size: 5 # Temporarily removed pool_size logic
  stream: false

helios:
  url: http://localhost:8000
  path: ../helios-server
