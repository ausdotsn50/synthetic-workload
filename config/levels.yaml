# Default values for level config
schemes:
  - elgamal          

levels: # Electoral size/voter count
  - 10

repetitions: 2

# For reproducibility, seed per config election run
seed: 424242

ballot_face: nle2025 # key into config/ballot_face.yaml

# Stage 3 aggregates with verify_p=False, matching Election.compute_tally
# (helios/models.py:491, "assuming votes already verified"). Verification is real
# production cost but it is paid at CAST time in Celery, per ballot, not at tally.
# There is no tally-time verification metric and no max-N gate for one.

# Stage 2a sampled encryption. Pilot at n0, then derive n
pilot:
  n0: 1000
  target_ci_fraction: 0.05   # 95% CI within ±5% of the mean
  z: 1.96

# Stage 2b bulk generation
#   pool_size: null      -> every ballot distinct 
#   pool_size: <int>     -> ballot-pool reuse
#   stream: true         -> never persist the board 
bulk:
  pool_size: 5 # Temporarily removed pool_size logic
  stream: false

# Timings are taken inside Helios's own code paths (helios-server branch
# measure/instrumentation). The harness drives the real flow, polls for phase
# completion, and joins the sidecar records on election uuid.
measurement:
  # FALLBACK ONLY. HELIOS_MEASURE_PATH takes precedence, because that is the
  # variable Helios itself reads — taking both from one place means the harness
  # can never look somewhere the writer is not writing.
  #
  # Fixed, NOT run-scoped: the Django process and the Celery worker are
  # long-lived and read the variable once at startup, so a per-run path cannot
  # reach them. Records carry election_uuid and one cell is one election, so
  # the join is exact regardless of how many runs share the file.
  sidecar_path: ~/helios-measure.jsonl
  poll_s: 0.05        # phase-completion polling. Under Option C this bounds
                      # the flow_* figures only; the operation and task spans
                      # are exact, both endpoints being in-process.
  timeout_s: 3600
  require_instrumentation: true   # fail the run if sidecar records are missing

# Stage 2 measurement shaping, from the 2026-09-20 calibration run.
encryption:
  # The first ballots read high against steady state (997/1100/843 ms vs ~675).
  # Encrypt and discard this many before measurement begins; they are still
  # emitted, tagged operational, so they stay in the record and out of the
  # analysis.
  warmup_ballots: 1

helios:
  url: http://localhost:8000
  path: ../helios-server
